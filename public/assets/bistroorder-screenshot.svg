<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bistroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0d1017" />
    </linearGradient>

    <!-- Warm Amber / Orange Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="1200" height="750" rx="14" fill="url(#bistroBg)" />
  
  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#0c0f18" />
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1f2430" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="26" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="26" r="6" fill="#10b981" opacity="0.85" />

  <!-- URL Address Bar -->
  <rect x="220" y="12" width="760" height="28" rx="6" fill="#151b27" stroke="#232e42" stroke-width="1" />
  <circle cx="238" cy="26" r="4" fill="#06b6d4" />
  <text x="252" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">https://bistroorder-food-delivery.vercel.app</text>
  <rect x="940" y="18" width="30" height="16" rx="4" fill="#06b6d4" opacity="0.2" />
  <text x="944" y="30" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold">SSL</text>

  <!-- Website Top Navbar -->
  <rect x="0" y="52" width="1200" height="75" fill="#0a0c13" opacity="0.95" />
  <line x1="0" y1="127" x2="1200" y2="127" stroke="#1d2230" stroke-width="1" />

  <!-- Brand Logo -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#amberGrad)" />
    <!-- Fork & Knife Icon -->
    <path d="M 14 12 L 14 26 M 11 12 L 11 18 M 17 12 L 17 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M 25 12 L 25 26 M 22 12 Q 26 18 22 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="48" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">BistroOrder</text>
  </g>

  <!-- Location & Delivery ETA Info -->
  <g transform="translate(340, 72)">
    <rect x="0" y="0" width="280" height="36" rx="8" fill="#131722" stroke="#252d3d" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="34" y="22" font-family="sans-serif" font-size="12" fill="#cbd5e1">Downtown Kitchen · <tspan fill="#34d399" font-weight="bold">Open (20-30 min)</tspan></text>
  </g>

  <!-- Category Navigation Bar -->
  <g transform="translate(50, 145)">
    <rect x="0" y="0" width="110" height="36" rx="8" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="18" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Chef's Mains (8)</text>

    <rect x="120" y="0" width="130" height="36" rx="8" fill="#131722" stroke="#202738" stroke-width="1" />
    <text x="135" y="23" font-family="sans-serif" font-size="12" fill="#94a3b8">Handmade Pastas (6)</text>

    <rect x="260" y="0" width="140" height="36" rx="8" fill="#131722" stroke="#202738" stroke-width="1" />
    <text x="275" y="23" font-family="sans-serif" font-size="12" fill="#94a3b8">Wood-Fired Pizzas (5)</text>

    <rect x="410" y="0" width="140" height="36" rx="8" fill="#131722" stroke="#202738" stroke-width="1" />
    <text x="425" y="23" font-family="sans-serif" font-size="12" fill="#94a3b8">Artisan Desserts (4)</text>
  </g>

  <!-- Left: Dish Menu Cards (2 Columns) -->

  <!-- Dish 1: Truffle Wild Mushroom Tagliatelle -->
  <g transform="translate(50, 205)">
    <rect x="0" y="0" width="370" height="235" rx="12" fill="url(#cardGrad3)" stroke="#222938" stroke-width="1.5" />
    
    <!-- Dish Image / Vector Illustration -->
    <rect x="15" y="15" width="140" height="150" rx="8" fill="#080a10" stroke="#18202d" stroke-width="1" />
    <circle cx="85" cy="90" r="50" fill="#1a140f" stroke="#78350f" stroke-width="2" />
    <!-- Pasta swirls -->
    <path d="M 65 90 Q 85 70 105 90 T 85 110" fill="none" stroke="#f59e0b" stroke-width="3" />
    <path d="M 70 95 Q 85 80 100 95" fill="none" stroke="#fcd34d" stroke-width="2.5" />
    <!-- Shaved Truffle bits -->
    <circle cx="80" cy="85" r="4" fill="#292524" />
    <circle cx="95" cy="92" r="3.5" fill="#292524" />
    <circle cx="76" cy="100" r="3" fill="#292524" />

    <!-- Badges -->
    <rect x="25" y="25" width="55" height="18" rx="4" fill="#f59e0b" opacity="0.3" />
    <text x="31" y="38" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f59e0b">SIGNATURE</text>

    <!-- Details -->
    <text x="170" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Truffle Wild Mushroom</text>
    <text x="170" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Tagliatelle</text>
    <text x="170" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Handmade egg pasta, black</text>
    <text x="170" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">truffle cream, aged parmesan.</text>
    <text x="170" y="130" font-family="sans-serif" font-size="10" fill="#34d399">🌱 Vegetarian option</text>

    <!-- Bottom Bar: Price & Add -->
    <line x1="15" y1="180" x2="355" y2="180" stroke="#1d2330" stroke-width="1" />
    <text x="20" y="210" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$24.00</text>
    
    <rect x="260" y="190" width="95" height="32" rx="6" fill="#0284c7" />
    <text x="278" y="211" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Add to Cart</text>
  </g>

  <!-- Dish 2: Wood-Fired Margherita D.O.P -->
  <g transform="translate(440, 205)">
    <rect x="0" y="0" width="370" height="235" rx="12" fill="url(#cardGrad3)" stroke="#222938" stroke-width="1.5" />
    
    <!-- Dish Image / Vector Illustration -->
    <rect x="15" y="15" width="140" height="150" rx="8" fill="#080a10" stroke="#18202d" stroke-width="1" />
    <!-- Pizza Crust & Sauce -->
    <circle cx="85" cy="90" r="50" fill="#78350f" stroke="#92400e" stroke-width="2" />
    <circle cx="85" cy="90" r="44" fill="#991b1b" />
    <circle cx="75" cy="80" r="10" fill="#fef08a" />
    <circle cx="95" cy="85" r="9" fill="#fef08a" />
    <circle cx="82" cy="102" r="11" fill="#fef08a" />
    <!-- Basil leaves -->
    <ellipse cx="88" cy="80" rx="4" ry="7" fill="#15803d" />
    <ellipse cx="78" cy="95" rx="4" ry="7" fill="#15803d" />

    <!-- Badges -->
    <rect x="25" y="25" width="55" height="18" rx="4" fill="#dc2626" opacity="0.3" />
    <text x="31" y="38" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f87171">ARTISAN</text>

    <!-- Details -->
    <text x="170" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Wood-Fired Margherita</text>
    <text x="170" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">D.O.P Napoletana</text>
    <text x="170" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">San Marzano DOP sauce,</text>
    <text x="170" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">fresh buffalo mozzarella, basil.</text>
    <text x="170" y="130" font-family="sans-serif" font-size="10" fill="#f59e0b">🔥 Wood-fired oven</text>

    <!-- Bottom Bar: Price & Add -->
    <line x1="15" y1="180" x2="355" y2="180" stroke="#1d2330" stroke-width="1" />
    <text x="20" y="210" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$21.00</text>
    
    <rect x="260" y="190" width="95" height="32" rx="6" fill="#0284c7" />
    <text x="278" y="211" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Add to Cart</text>
  </g>

  <!-- Dish 3: Espresso Tiramisu Classico -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="370" height="235" rx="12" fill="url(#cardGrad3)" stroke="#222938" stroke-width="1.5" />
    
    <!-- Dish Image / Vector Illustration -->
    <rect x="15" y="15" width="140" height="150" rx="8" fill="#080a10" stroke="#18202d" stroke-width="1" />
    <!-- Tiramisu Slice -->
    <rect x="50" y="65" width="70" height="55" rx="6" fill="#451a03" stroke="#78350f" stroke-width="1.5" />
    <rect x="50" y="75" width="70" height="12" fill="#fef3c7" />
    <rect x="50" y="95" width="70" height="12" fill="#fef3c7" />
    <rect x="50" y="65" width="70" height="6" fill="#292524" />

    <!-- Badges -->
    <rect x="25" y="25" width="55" height="18" rx="4" fill="#a855f7" opacity="0.3" />
    <text x="31" y="38" font-family="sans-serif" font-size="9" font-weight="bold" fill="#c084fc">DOLCI</text>

    <!-- Details -->
    <text x="170" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Espresso Tiramisu</text>
    <text x="170" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Classico Italiano</text>
    <text x="170" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Mascarpone mousse, Italian</text>
    <text x="170" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">savoiardi, Valrhona cocoa.</text>
    <text x="170" y="130" font-family="sans-serif" font-size="10" fill="#38bdf8">☕ Fresh espresso soak</text>

    <!-- Bottom Bar: Price & Add -->
    <line x1="15" y1="180" x2="355" y2="180" stroke="#1d2330" stroke-width="1" />
    <text x="20" y="210" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$11.00</text>
    
    <rect x="260" y="190" width="95" height="32" rx="6" fill="#0284c7" />
    <text x="278" y="211" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Add to Cart</text>
  </g>

  <!-- Dish 4: Burrata Con Pomodorini -->
  <g transform="translate(440, 460)">
    <rect x="0" y="0" width="370" height="235" rx="12" fill="url(#cardGrad3)" stroke="#222938" stroke-width="1.5" />
    
    <!-- Dish Image / Vector Illustration -->
    <rect x="15" y="15" width="140" height="150" rx="8" fill="#080a10" stroke="#18202d" stroke-width="1" />
    <!-- Burrata Bowl -->
    <circle cx="85" cy="90" r="50" fill="#161e2e" stroke="#253248" stroke-width="2" />
    <circle cx="85" cy="88" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <!-- Cherry Tomatoes -->
    <circle cx="68" cy="105" r="8" fill="#dc2626" />
    <circle cx="102" cy="102" r="8" fill="#dc2626" />
    <circle cx="85" cy="115" r="7" fill="#dc2626" />

    <!-- Badges -->
    <rect x="25" y="25" width="60" height="18" rx="4" fill="#10b981" opacity="0.3" />
    <text x="31" y="38" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34d399">APPETIZER</text>

    <!-- Details -->
    <text x="170" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Pugliese Burrata Con</text>
    <text x="170" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Pomodorini &amp; Crostini</text>
    <text x="170" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Creamy artisanal burrata,</text>
    <text x="170" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">confit cherry tomatoes, basil.</text>
    <text x="170" y="130" font-family="sans-serif" font-size="10" fill="#34d399">🌿 Fresh daily import</text>

    <!-- Bottom Bar: Price & Add -->
    <line x1="15" y1="180" x2="355" y2="180" stroke="#1d2330" stroke-width="1" />
    <text x="20" y="210" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$16.00</text>
    
    <rect x="260" y="190" width="95" height="32" rx="6" fill="#0284c7" />
    <text x="278" y="211" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Add to Cart</text>
  </g>

  <!-- Right Side: Live Floating Order Cart Drawer -->
  <g transform="translate(830, 205)">
    <rect x="0" y="0" width="320" height="490" rx="14" fill="#0e131d" stroke="#253043" stroke-width="2" />
    
    <!-- Cart Header -->
    <rect x="0" y="0" width="320" height="55" rx="14" fill="#141a27" />
    <text x="20" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Your Order (2 items)</text>
    <rect x="235" y="16" width="65" height="24" rx="6" fill="#10b981" opacity="0.2" />
    <text x="244" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">Free Delivery</text>

    <!-- Order Item 1 -->
    <g transform="translate(20, 75)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">1 × Truffle Tagliatelle</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11" fill="#94a3b8">Extra shaved parmesan</text>
      <text x="220" y="25" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8">$24.00</text>
    </g>

    <line x1="20" y1="125" x2="300" y2="125" stroke="#1e2736" stroke-width="1" />

    <!-- Order Item 2 -->
    <g transform="translate(20, 140)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">1 × Margherita D.O.P</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11" fill="#94a3b8">Thin crust, fresh basil</text>
      <text x="220" y="25" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8">$21.00</text>
    </g>

    <line x1="20" y1="190" x2="300" y2="190" stroke="#1e2736" stroke-width="1" />

    <!-- Delivery Details -->
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="280" height="70" rx="8" fill="#131926" stroke="#1e2736" stroke-width="1" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">DELIVER TO</text>
      <text x="16" y="44" font-family="sans-serif" font-size="12" fill="#ffffff">742 Evergreen Terrace, Apt 4B</text>
      <text x="16" y="60" font-family="sans-serif" font-size="10" fill="#10b981">Estimated arrival: 24 mins</text>
    </g>

    <!-- Calculation Summary -->
    <g transform="translate(20, 300)">
      <text x="0" y="18" font-family="sans-serif" font-size="12" fill="#94a3b8">Subtotal</text>
      <text x="240" y="18" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">$45.00</text>

      <text x="0" y="40" font-family="sans-serif" font-size="12" fill="#94a3b8">Delivery Fee</text>
      <text x="242" y="40" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">FREE</text>

      <text x="0" y="62" font-family="sans-serif" font-size="12" fill="#94a3b8">Taxes &amp; Fees</text>
      <text x="246" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">$3.80</text>

      <line x1="0" y1="78" x2="280" y2="78" stroke="#1e2736" stroke-width="1" />

      <text x="0" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Total Order</text>
      <text x="220" y="104" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$48.80</text>
    </g>

    <!-- Checkout Button -->
    <rect x="20" y="425" width="280" height="45" rx="8" fill="#0284c7" />
    <text x="75" y="453" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Proceed to Checkout →</text>
  </g>
</svg>
