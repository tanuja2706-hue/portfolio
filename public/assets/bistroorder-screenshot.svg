<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Clean Warm White Background -->
  <rect width="1200" height="680" fill="#ffffff" />

  <!-- Top Header Bar -->
  <g id="header" transform="translate(40, 20)">
    <!-- Brand Logo -->
    <circle cx="24" cy="24" r="22" fill="#ea580c" />
    <text x="17" y="32" font-size="24" font-weight="900" fill="#ffffff">B</text>
    <text x="56" y="27" font-size="24" font-weight="900" letter-spacing="-0.5" fill="#18181b">BistroOrder</text>
    <text x="56" y="42" font-size="12" fill="#71717a">Good food. Delivered your way.</text>

    <!-- Location Selector Pill -->
    <g transform="translate(260, 4)">
      <rect width="215" height="42" rx="8" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#ea580c" />
      <text x="35" y="16" font-size="10" fill="#71717a">Choose your location</text>
      <text x="35" y="30" font-size="13" font-weight="700" fill="#18181b">Indiranagar, Bengaluru ⌵</text>
    </g>

    <!-- Search Bar -->
    <g transform="translate(490, 4)">
      <rect width="310" height="42" rx="8" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
      <circle cx="20" cy="21" r="6" stroke="#a1a1aa" stroke-width="2" fill="none" />
      <line x1="25" y1="26" x2="30" y2="31" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="26" font-size="13" fill="#a1a1aa">Search dishes, restaurants or cuisine</text>
    </g>

    <!-- Heart, Account, Cart -->
    <g transform="translate(850, 10)">
      <!-- Heart -->
      <path d="M16 8 C13 4 8 4 5 8 C2 4 -3 4 -6 8 C-9 14 0 20 5 24 C10 20 19 14 16 8 Z" fill="none" stroke="#27272a" stroke-width="2" />
      
      <!-- Account -->
      <g transform="translate(50, 0)">
        <circle cx="10" cy="6" r="4.5" stroke="#27272a" stroke-width="2" fill="none" />
        <path d="M3 18 C3 14 17 14 17 18" stroke="#27272a" stroke-width="2" fill="none" />
        <text x="24" y="14" font-size="14" font-weight="600" fill="#27272a">Account</text>
      </g>

      <!-- Cart Button -->
      <g transform="translate(160, -7)">
        <rect width="90" height="40" rx="8" fill="#18181b" />
        <rect x="14" y="12" width="16" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2" />
        <path d="M18 12 V10 C18 9 19 8 22 8 C25 8 26 9 26 10 V12" fill="none" stroke="#ffffff" stroke-width="2" />
        <text x="38" y="25" font-size="14" font-weight="700" fill="#ffffff">Cart</text>
      </g>
    </g>
  </g>

  <!-- Main Hero Banner Container (Warm Ivory Tone) -->
  <g id="main-banner" transform="translate(40, 100)">
    <rect width="1120" height="540" rx="24" fill="#faf5ef" />

    <!-- Left Content Column -->
    <g transform="translate(50, 60)">
      <!-- Fresh Picks Pill Badge -->
      <rect width="165" height="34" rx="17" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
      <text x="18" y="22" font-size="12" fill="#ea580c">✨ Fresh picks for you</text>

      <!-- Headline -->
      <text x="0" y="115" font-size="52" font-weight="900" fill="#18181b" letter-spacing="-1">
        What’s cooking today?
      </text>

      <!-- Subtitle -->
      <text x="0" y="180" font-size="16" fill="#52525b" line-height="1.6">
        Discover local favourites, hidden gems and dishes worth
      </text>
      <text x="0" y="208" font-size="16" fill="#52525b" line-height="1.6">
        ordering. Handcrafted feasts from the finest kitchens, brought
      </text>
      <text x="0" y="236" font-size="16" fill="#52525b" line-height="1.6">
        fresh to your table.
      </text>

      <!-- Buttons -->
      <g transform="translate(0, 290)">
        <!-- Explore Restaurants -->
        <rect width="200" height="52" rx="12" fill="#c2410c" />
        <text x="24" y="32" font-size="15" font-weight="700" fill="#ffffff">Explore Restaurants  →</text>

        <!-- Browse Dishes -->
        <rect x="220" width="145" height="52" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5" />
        <text x="246" y="32" font-size="15" font-weight="700" fill="#18181b">Browse Dishes</text>
      </g>

      <!-- Key Features Dots -->
      <g transform="translate(0, 400)" font-size="13" font-weight="600" fill="#3f3f46">
        <circle cx="4" cy="-4" r="4" fill="#15803d" />
        <text x="14" y="0">Curated Kitchens</text>

        <circle cx="150" cy="-4" r="4" fill="#ea580c" />
        <text x="160" y="0">Easy Ordering</text>

        <polygon points="275,-9 278,-1 286,-1 280,4 282,12 275,7 268,12 270,4 264,-1 272,-1" fill="#ea580c" />
        <text x="290" y="0">Great Food</text>
      </g>
    </g>

    <!-- Right Side: Plate of Biryani with Floating Menu Cards -->
    <g transform="translate(680, 50)">
      <!-- Food Platter Image Masked Container -->
      <clipPath id="foodClip">
        <rect width="390" height="440" rx="20" />
      </clipPath>

      <g clip-path="url(#foodClip)">
        <!-- Background Dark Ambient -->
        <rect width="390" height="440" fill="#09090b" />

        <!-- Ceramic Plate of Biryani -->
        <g transform="translate(195, 260)">
          <!-- White Ceramic Oval Plate -->
          <ellipse cx="0" cy="0" rx="180" ry="150" fill="#f8fafc" />
          <ellipse cx="0" cy="0" rx="165" ry="135" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />

          <!-- Golden Saffron Rice Bed -->
          <ellipse cx="0" cy="5" rx="145" ry="115" fill="#ca8a04" />
          <ellipse cx="0" cy="0" rx="135" ry="105" fill="#eab308" />

          <!-- Rice Details & Spices -->
          <!-- Cardamom, Cloves, Fried Onions, Spiced Meat pieces -->
          <ellipse cx="-20" cy="-10" rx="40" ry="25" fill="#92400e" opacity="0.9" />
          <ellipse cx="30" cy="20" rx="45" ry="30" fill="#78350f" opacity="0.85" />
          <ellipse cx="-40" cy="30" rx="35" ry="20" fill="#b45309" opacity="0.9" />
          <ellipse cx="20" cy="-30" rx="40" ry="25" fill="#854d0e" opacity="0.9" />

          <!-- Yellow Rice Grains & Garnish -->
          <path d="M-50 0 C-20 -20 20 -20 50 0 C20 20 -20 20 -50 0 Z" fill="#fef08a" />
          <path d="M-60 -30 C-30 -40 10 -40 40 -25" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />
          <path d="M-30 40 C0 50 40 40 60 25" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />

          <!-- Fresh Green Mint Leaves -->
          <ellipse cx="-30" cy="-5" rx="16" ry="9" fill="#15803d" transform="rotate(-25 -30 -5)" />
          <ellipse cx="-20" cy="5" rx="14" ry="8" fill="#16a34a" transform="rotate(35 -20 5)" />

          <!-- Cucumber Slices on Rim -->
          <ellipse cx="-130" cy="10" rx="20" ry="14" fill="#86efac" stroke="#16a34a" stroke-width="3" />
          <ellipse cx="-115" cy="45" rx="20" ry="14" fill="#86efac" stroke="#16a34a" stroke-width="3" />
          <ellipse cx="-90" cy="75" rx="20" ry="14" fill="#86efac" stroke="#16a34a" stroke-width="3" />

          <!-- Lemon Wedge -->
          <path d="M110 -20 A22 22 0 0 1 130 10 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
        </g>

        <!-- Gravy / Salan Bowl in Background -->
        <g transform="translate(100, 70)">
          <ellipse cx="0" cy="0" rx="55" ry="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
          <ellipse cx="0" cy="2" rx="46" ry="30" fill="#9a3412" />
          <ellipse cx="0" cy="0" rx="38" ry="22" fill="#c2410c" />
        </g>
      </g>

      <!-- Floating Badge 1: Shahi Biryani (Top Right) -->
      <g transform="translate(200, 15)">
        <rect width="170" height="68" rx="14" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))" />
        <!-- Dish Thumbnail -->
        <rect x="10" y="10" width="48" height="48" rx="10" fill="#ea580c" />
        <circle cx="34" cy="34" r="18" fill="#ca8a04" />
        <!-- Info -->
        <text x="66" y="28" font-size="12" font-weight="800" fill="#18181b">Shahi Biryani</text>
        <text x="66" y="42" font-size="10" fill="#71717a">Masala &amp; Ember</text>
        <text x="66" y="56" font-size="12" font-weight="800" fill="#ea580c">₹449</text>
      </g>

      <!-- Floating Badge 2: Ghee Roast Dosa (Bottom Left) -->
      <g transform="translate(-20, 360)">
        <rect width="175" height="68" rx="14" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))" />
        <!-- Dish Thumbnail -->
        <rect x="10" y="10" width="48" height="48" rx="10" fill="#fef3c7" />
        <ellipse cx="34" cy="34" rx="20" ry="14" fill="#b45309" />
        <!-- Info -->
        <text x="66" y="28" font-size="12" font-weight="800" fill="#18181b">Ghee Roast Dosa</text>
        <text x="66" y="42" font-size="10" fill="#71717a">★ 4.9</text>
        <text x="66" y="56" font-size="12" font-weight="800" fill="#ea580c">₹249</text>
      </g>
    </g>

  </g>
</svg>
