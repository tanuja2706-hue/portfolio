    <rect x="715" y="10" width="120" height="34" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="728" y="32" font-family="sans-serif" font-size="11" fill="#cbd5e1">Sort: Highest Rated ▾</text>
  </g>

  <!-- Product 1: Pro ANC Wireless Headphones -->
  <g transform="translate(315, 215)">
