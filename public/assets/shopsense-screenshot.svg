<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="1200" height="750" rx="14" fill="url(#shopBg)" />
  
  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#0b101c" />
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="26" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="26" r="6" fill="#10b981" opacity="0.85" />

  <!-- URL Address Bar -->
  <rect x="220" y="12" width="760" height="28" rx="6" fill="#151d2e" stroke="#24324a" stroke-width="1" />
  <circle cx="238" cy="26" r="4" fill="#06b6d4" />
  <text x="252" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">https://shopsense.ai.studio</text>
  <rect x="940" y="18" width="30" height="16" rx="4" fill="#06b6d4" opacity="0.2" />
  <text x="944" y="30" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold">SSL</text>

  <!-- Website Top Navbar -->
  <rect x="0" y="52" width="1200" height="75" fill="#090d17" opacity="0.95" />
  <line x1="0" y1="127" x2="1200" y2="127" stroke="#1e293b" stroke-width="1" />

  <!-- Brand Logo -->
  <g transform="translate(50, 72)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#cyanGrad2)" />
    <circle cx="18" cy="18" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="18" cy="18" r="4" fill="#0891b2" />
    <text x="46" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">ShopSense</text>
  </g>

  <!-- Search Bar with Live Filter Input -->
  <g transform="translate(320, 68)">
    <rect x="0" y="0" width="520" height="42" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" stroke="#06b6d4" stroke-width="2" fill="none" />
    <line x1="29" y1="26" x2="36" y2="33" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="26" font-family="sans-serif" font-size="13" fill="#cbd5e1">Search 250+ electronics, gadgets, audio gear...</text>
    <rect x="420" y="7" width="90" height="28" rx="6" fill="#1e293b" />
    <text x="432" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">In Stock (180)</text>
  </g>

  <!-- Right Actions: Wishlist & Cart -->
  <g transform="translate(980, 72)">
    <rect x="0" y="0" width="80" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="23" font-family="sans-serif" font-size="12" fill="#cbd5e1">Wishlist (4)</text>

    <rect x="90" y="0" width="80" height="36" rx="8" fill="#0284c7" />
    <text x="105" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Cart (1)</text>
  </g>

  <!-- Main Body: Left Sidebar (Filters) + Right Product Grid -->

  <!-- Left Sidebar (Multi-Criteria Filter Panel) -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="240" height="565" rx="12" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
    
    <text x="20" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1">FILTERS</text>
    <text x="175" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#06b6d4">Reset All</text>
    <line x1="20" y1="46" x2="220" y2="46" stroke="#1e293b" stroke-width="1" />

    <!-- Categories Accordion -->
    <text x="20" y="75" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="1">CATEGORY</text>
    
    <rect x="20" y="90" width="200" height="28" rx="6" fill="#06b6d4" opacity="0.15" />
    <text x="32" y="108" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">All Electronics (254)</text>

    <text x="32" y="142" font-family="sans-serif" font-size="12" fill="#94a3b8">Audio &amp; Headphones (64)</text>
    <text x="32" y="174" font-family="sans-serif" font-size="12" fill="#94a3b8">Smart Wearables (42)</text>
    <text x="32" y="206" font-family="sans-serif" font-size="12" fill="#94a3b8">Power &amp; Charging (38)</text>
    <text x="32" y="238" font-family="sans-serif" font-size="12" fill="#94a3b8">Smart Home Tech (55)</text>

    <line x1="20" y1="260" x2="220" y2="260" stroke="#1e293b" stroke-width="1" />

    <!-- Price Range Filter -->
    <text x="20" y="290" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="1">PRICE RANGE</text>
    <rect x="20" y="310" width="200" height="6" rx="3" fill="#1e293b" />
    <rect x="20" y="310" width="130" height="6" rx="3" fill="#06b6d4" />
    <circle cx="150" cy="313" r="7" fill="#ffffff" stroke="#06b6d4" stroke-width="2" />
    <text x="20" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">$0 - $200</text>

    <line x1="20" y1="365" x2="220" y2="365" stroke="#1e293b" stroke-width="1" />

    <!-- Rating Filter -->
    <text x="20" y="395" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="1">CUSTOMER RATING</text>
    <g transform="translate(20, 410)">
      <circle cx="6" cy="6" r="5" fill="#06b6d4" />
      <text x="20" y="10" font-family="sans-serif" font-size="11" fill="#f59e0b">★ ★ ★ ★ ★ (4.5 &amp; up)</text>
    </g>
    <g transform="translate(20, 435)">
      <circle cx="6" cy="6" r="5" stroke="#475569" fill="none" />
      <text x="20" y="10" font-family="sans-serif" font-size="11" fill="#94a3b8">★ ★ ★ ★ ☆ (4.0 &amp; up)</text>
    </g>

    <!-- Availability Tag -->
    <g transform="translate(20, 480)">
      <rect x="0" y="0" width="200" height="40" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="20" r="5" fill="#10b981" />
      <text x="35" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Instant Delivery Only</text>
    </g>
  </g>

  <!-- Right Product Grid Section -->

  <!-- Grid Header / Stats -->
  <g transform="translate(315, 150)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Trending Gadgets &amp; Hardware</text>
