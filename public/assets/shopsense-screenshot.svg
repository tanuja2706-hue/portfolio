    <!-- Headphones Vector Art -->
    <path d="M 85 110 C 85 65 180 65 180 110" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <path d="M 95 110 C 95 75 170 75 170 110" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <!-- Earcups -->
    <ellipse cx="85" cy="125" rx="18" ry="32" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <ellipse cx="85" cy="125" rx="10" ry="22" fill="#0f172a" />
    <ellipse cx="180" cy="125" rx="18" ry="32" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <ellipse cx="180" cy="125" rx="10" ry="22" fill="#0f172a" />

    <!-- Badges -->
