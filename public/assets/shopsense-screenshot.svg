    <text x="28" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">TOP RATED</text>

    <!-- Content -->
    <text x="16" y="246" font-family="sans-serif" font-size="10" font-weight="bold" fill="#06b6d4">AUDIO &amp; WEARABLES</text>
    <text x="16" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Pro ANC Wireless Headphones</text>
    <text x="16" y="288" font-family="sans-serif" font-size="11" fill="#f59e0b">★ 4.9 <tspan fill="#64748b">(128 verified reviews)</tspan></text>

    <line x1="16" y1="305" x2="249" y2="305" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="335" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$189.00</text>
    <text x="95" y="334" font-family="sans-serif" font-size="10" fill="#10b981">✓ In Stock</text>

    <rect x="16" y="350" width="233" height="36" rx="6" fill="#0284c7" />
    <text x="88" y="373" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Add to Cart</text>
  </g>

  <!-- Product 2: PulseFit Smart Fitness Band -->
  <g transform="translate(600, 215)">
    <rect x="0" y="0" width="265" height="400" rx="12" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Image Area -->
    <rect x="12" y="12" width="241" height="210" rx="8" fill="#080c14" stroke="#161f30" stroke-width="1" />
    
    <!-- Smart Band Vector -->
    <rect x="110" y="40" width="45" height="150" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="117" y="80" width="31" height="65" rx="10" fill="#020617" stroke="#06b6d4" stroke-width="2" />
    <text x="124" y="105" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">10:42</text>
    <text x="124" y="120" font-family="sans-serif" font-size="8" fill="#10b981">♥ 74 bpm</text>
    <circle cx="132" cy="133" r="3" fill="#f59e0b" />

    <!-- Badges -->
    <rect x="22" y="22" width="55" height="20" rx="4" fill="#10b981" opacity="0.3" />
    <text x="28" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">NEW GEN</text>

    <!-- Content -->
    <text x="16" y="246" font-family="sans-serif" font-size="10" font-weight="bold" fill="#06b6d4">SMART WEARABLES</text>
    <text x="16" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">PulseFit Smart Band v5</text>
    <text x="16" y="288" font-family="sans-serif" font-size="11" fill="#f59e0b">★ 4.8 <tspan fill="#64748b">(84 verified reviews)</tspan></text>

    <line x1="16" y1="305" x2="249" y2="305" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="335" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$89.00</text>
    <text x="85" y="334" font-family="sans-serif" font-size="10" fill="#10b981">✓ In Stock</text>

    <rect x="16" y="350" width="233" height="36" rx="6" fill="#0284c7" />
    <text x="88" y="373" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Add to Cart</text>
  </g>

  <!-- Product 3: MagSafe 3-in-1 Charging Stand -->
  <g transform="translate(885, 215)">
    <rect x="0" y="0" width="265" height="400" rx="12" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Image Area -->
    <rect x="12" y="12" width="241" height="210" rx="8" fill="#080c14" stroke="#161f30" stroke-width="1" />
    
    <!-- MagSafe Stand Vector -->
    <rect x="75" y="160" width="115" height="18" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="125" y="80" width="14" height="85" rx="3" fill="#334155" />
    <circle cx="132" cy="75" r="34" fill="#0f172a" stroke="#06b6d4" stroke-width="3" />
    <circle cx="132" cy="75" r="22" stroke="#38bdf8" stroke-dasharray="4,4" fill="none" />
    <circle cx="132" cy="75" r="4" fill="#38bdf8" />

    <!-- Badges -->
    <rect x="22" y="22" width="55" height="20" rx="4" fill="#f59e0b" opacity="0.3" />
    <text x="28" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">POPULAR</text>

    <!-- Content -->
    <text x="16" y="246" font-family="sans-serif" font-size="10" font-weight="bold" fill="#06b6d4">POWER &amp; CHARGING</text>
    <text x="16" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">MagSafe 3-in-1 Fast Stand</text>
    <text x="16" y="288" font-family="sans-serif" font-size="11" fill="#f59e0b">★ 4.7 <tspan fill="#64748b">(42 verified reviews)</tspan></text>

    <line x1="16" y1="305" x2="249" y2="305" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="335" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$59.00</text>
    <text x="85" y="334" font-family="sans-serif" font-size="10" fill="#10b981">✓ In Stock</text>

    <rect x="16" y="350" width="233" height="36" rx="6" fill="#0284c7" />
    <text x="88" y="373" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Add to Cart</text>
  </g>
</svg>
