<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Clean White Background -->
  <rect width="1200" height="680" fill="#ffffff" />

  <!-- Top Header Bar -->
  <g id="header" transform="translate(40, 20)">
    <!-- ShopSense Logo -->
    <g transform="translate(0, 4)">
      <rect width="40" height="40" rx="8" fill="#facc15" />
      <path d="M14 28 C14 31 26 31 26 27 C26 21 14 21 14 16 C14 11 26 11 26 14" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
    </g>
    <text x="52" y="32" font-size="28" font-weight="900" letter-spacing="-0.5" fill="#111827">ShopSense</text>

    <!-- Search Input Bar -->
    <g transform="translate(265, 0)">
      <rect width="480" height="46" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <circle cx="26" cy="23" r="7" stroke="#9ca3af" stroke-width="2" fill="none" />
      <line x1="31" y1="28" x2="38" y2="35" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
      <text x="48" y="29" font-size="14" fill="#9ca3af">Search for products, brands and more</text>
    </g>

    <!-- Account, Wishlist, Cart -->
    <g transform="translate(780, 10)">
      <!-- Account -->
      <circle cx="20" cy="10" r="5" stroke="#1f2937" stroke-width="2" fill="none" />
      <path d="M12 24 C12 19 28 19 28 24" stroke="#1f2937" stroke-width="2" fill="none" />
      <text x="35" y="19" font-size="14" font-weight="600" fill="#1f2937">Account ⌵</text>

      <!-- Wishlist with 3 badge -->
      <g transform="translate(130, 0)">
        <path d="M18 10 C15 6 9 6 6 11 C3 6 -3 6 -6 11 C-10 18 0 25 6 30 C12 25 22 18 18 10 Z" fill="none" stroke="#1f2937" stroke-width="2" />
        <circle cx="18" cy="4" r="9" fill="#ea580c" />
        <text x="14.5" y="8" font-size="11" font-weight="700" fill="#ffffff">3</text>
      </g>

      <!-- Cart Button with yellow badge -->
      <g transform="translate(175, -5)">
        <rect width="115" height="42" rx="8" fill="#18181b" />
        <rect x="16" y="13" width="18" height="18" rx="3" fill="none" stroke="#facc15" stroke-width="2" />
        <path d="M21 13 V10 C21 8.5 22.5 7 25 7 C27.5 7 29 8.5 29 10 V13" fill="none" stroke="#facc15" stroke-width="2" />
        <text x="42" y="27" font-size="14" font-weight="700" fill="#ffffff">Cart</text>
        <circle cx="95" cy="21" r="9" fill="#facc15" />
        <text x="91.5" y="25.5" font-size="12" font-weight="900" fill="#18181b">1</text>
      </g>
    </g>
  </g>

  <!-- Category Nav Tabs -->
  <g id="category-tabs" transform="translate(40, 95)" font-size="14" font-weight="600" fill="#4b5563">
    <text x="10" y="20" fill="#111827" font-weight="800">For You</text>
    <line x1="10" y1="32" x2="68" y2="32" stroke="#111827" stroke-width="3" />
    <text x="110" y="20">Fashion</text>
    <text x="210" y="20">Electronics</text>
    <text x="330" y="20">Beauty</text>
    <text x="420" y="20">Home &amp; Living</text>
    <text x="560" y="20">Accessories</text>
    <text x="690" y="20">Mobiles</text>
    <text x="790" y="20">Appliances</text>
  </g>

  <!-- Divider Line -->
  <line x1="0" y1="135" x2="1200" y2="135" stroke="#f3f4f6" stroke-width="1.5" />

  <!-- Circular Visual Category Icons Row -->
  <g id="category-icons" transform="translate(40, 150)">
    <!-- 1. Electronics -->
    <g transform="translate(0, 0)">
      <rect width="65" height="65" rx="14" fill="#fef08a" />
      <!-- Headphones icon -->
      <path d="M22 34 C22 22 43 22 43 34" fill="none" stroke="#1f2937" stroke-width="3" />
      <rect x="18" y="32" width="8" height="16" rx="3" fill="#1f2937" />
      <rect x="39" y="32" width="8" height="16" rx="3" fill="#1f2937" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Electronics</text>
    </g>

    <!-- 2. Fashion -->
    <g transform="translate(135, 0)">
      <rect width="65" height="65" rx="14" fill="#f3f4f6" />
      <path d="M22 18 L32 28 L43 18 L38 52 L32 58 L27 52 Z" fill="#1e293b" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Fashion</text>
    </g>

    <!-- 3. Beauty -->
    <g transform="translate(270, 0)">
      <rect width="65" height="65" rx="14" fill="#f3f4f6" />
      <rect x="24" y="18" width="18" height="34" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <rect x="29" y="12" width="8" height="7" rx="1" fill="#64748b" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Beauty</text>
    </g>

    <!-- 4. Home & Living -->
    <g transform="translate(405, 0)">
      <rect width="65" height="65" rx="14" fill="#f3f4f6" />
      <circle cx="32.5" cy="32.5" r="18" fill="#78350f" opacity="0.8" />
      <circle cx="32.5" cy="32.5" r="14" fill="#fef3c7" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Home &amp; Living</text>
    </g>

    <!-- 5. Accessories -->
    <g transform="translate(540, 0)">
      <rect width="65" height="65" rx="14" fill="#f3f4f6" />
      <rect x="20" y="20" width="25" height="32" rx="6" fill="#334155" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Accessories</text>
    </g>

    <!-- 6. Mobiles -->
    <g transform="translate(675, 0)">
      <rect width="65" height="65" rx="14" fill="#f3f4f6" />
      <rect x="22" y="15" width="22" height="36" rx="4" fill="#0f172a" />
      <rect x="24" y="18" width="18" height="30" rx="2" fill="#38bdf8" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Mobiles</text>
    </g>

    <!-- 7. Appliances -->
    <g transform="translate(810, 0)">
      <rect width="65" height="65" rx="14" fill="#f3f4f6" />
      <circle cx="32.5" cy="32.5" r="16" fill="#581c87" />
      <circle cx="32.5" cy="32.5" r="8" fill="#c084fc" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Appliances</text>
    </g>

    <!-- 8. Lifestyle -->
    <g transform="translate(945, 0)">
      <rect width="65" height="65" rx="14" fill="#f3f4f6" />
      <rect x="18" y="18" width="30" height="30" rx="3" fill="#fda4af" />
      <text x="32.5" y="86" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Lifestyle</text>
    </g>
  </g>

  <!-- Big Hero Promotion Banner -->
  <g id="main-banner" transform="translate(40, 260)">
    <!-- Dark Container -->
    <rect width="1120" height="390" rx="20" fill="#18181b" />

    <!-- Left Content -->
    <g transform="translate(50, 60)">
      <!-- Badge -->
      <rect width="215" height="30" rx="6" fill="#eab308" />
      <text x="14" y="20" font-size="12" font-weight="800" fill="#18181b" letter-spacing="1">SEASONAL TECH PROMOTION</text>

      <!-- Headline -->
      <text x="0" y="80" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
        Smart Tech. Better
      </text>
      <text x="0" y="132" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
        Everyday.
      </text>

      <!-- Subtitle -->
      <text x="0" y="180" font-size="15" fill="#a1a1aa">
        Explore electronics, acoustics &amp; workstation accessories
      </text>

      <!-- Button -->
      <g transform="translate(0, 220)">
        <rect width="195" height="50" rx="10" fill="#eab308" />
        <text x="24" y="31" font-size="15" font-weight="800" fill="#18181b">Shop Electronics  →</text>
      </g>
    </g>

    <!-- Left & Right Carousel Arrows -->
    <circle cx="30" cy="195" r="20" fill="#e4e4e7" />
    <path d="M33 188 L26 195 L33 202" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

    <circle cx="1090" cy="195" r="20" fill="#e4e4e7" />
    <path d="M1087 188 L1094 195 L1087 202" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Side Product Spotlight: Vibrant Yellow Box with Headphones -->
    <g transform="translate(680, 45)">
      <rect width="330" height="300" rx="18" fill="#eab308" />

      <!-- Realistic Black Over-Ear Headphones Graphic -->
      <g transform="translate(165, 150)">
        <!-- Headband Arch -->
        <path d="M-80 0 C-80 -105 80 -105 80 0" fill="none" stroke="#18181b" stroke-width="24" stroke-linecap="round" />
        <path d="M-70 -20 C-70 -90 70 -90 70 -20" fill="none" stroke="#27272a" stroke-width="8" stroke-linecap="round" />
        
        <!-- Left Ear Cup -->
        <ellipse cx="-80" cy="10" rx="26" ry="46" fill="#18181b" />
        <ellipse cx="-80" cy="10" rx="18" ry="36" fill="#27272a" />
        <circle cx="-80" cy="10" r="10" fill="#09090b" />
        
        <!-- Right Ear Cup -->
        <ellipse cx="80" cy="10" rx="26" ry="46" fill="#18181b" />
        <ellipse cx="80" cy="10" rx="18" ry="36" fill="#27272a" />
        <circle cx="80" cy="10" r="10" fill="#09090b" />
      </g>
    </g>

  </g>
</svg>
