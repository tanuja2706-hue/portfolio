<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="luxeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Gold / Bronze Luxury Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan Ambient Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="1200" height="750" rx="14" fill="url(#luxeBg)" />
  
  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#0c111c" />
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1f293d" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="26" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="26" r="6" fill="#10b981" opacity="0.85" />

  <!-- URL Address Bar -->
  <rect x="220" y="12" width="760" height="28" rx="6" fill="#161f30" stroke="#25334c" stroke-width="1" />
  <circle cx="238" cy="26" r="4" fill="#06b6d4" />
  <text x="252" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">https://luxecart-minimalist-luxury-e-commerce.ai.studio</text>
  <rect x="940" y="18" width="30" height="16" rx="4" fill="#06b6d4" opacity="0.2" />
  <text x="944" y="30" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold">SSL</text>

  <!-- Website Top Navbar -->
  <rect x="0" y="52" width="1200" height="70" fill="#080c14" opacity="0.95" />
  <line x1="0" y1="122" x2="1200" y2="122" stroke="#1a2333" stroke-width="1" />

  <!-- Brand Logo -->
  <text x="50" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="3">LUXECART</text>
  <circle cx="195" cy="92" r="3" fill="#06b6d4" />

  <!-- Nav Items -->
  <text x="320" y="94" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="1">TIMEPIECES</text>
  <text x="440" y="94" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1">LEATHER GOODS</text>
  <text x="590" y="94" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1">ACCESSORIES</text>
  <text x="730" y="94" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1">COLLECTIONS</text>

  <!-- Right Actions: Wishlist & Bag Button -->
  <rect x="1010" y="70" width="140" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="1030" y="93" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">BAG (2)</text>
  <text x="1086" y="93" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">$500.00</text>

  <!-- Hero Banner Strip -->
  <rect x="50" y="145" width="1100" height="150" rx="12" fill="#0d131f" stroke="#1f293d" stroke-width="1" />
  <text x="90" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#06b6d4" letter-spacing="2">SPRING HOROLOGY &amp; LEATHER COLLECTION</text>
  <text x="90" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="#ffffff">Minimalist Luxury. Engineered Precision.</text>
  <text x="90" y="265" font-family="sans-serif" font-size="13" fill="#94a3b8">Curated timepieces, full-grain Italian leather folios, and refined personal essentials.</text>

  <!-- Filter Pills -->
  <g transform="translate(50, 315)">
    <rect x="0" y="0" width="70" height="30" rx="6" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1" />
    <text x="18" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">All (18)</text>

    <rect x="80" y="0" width="115" height="30" rx="6" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <text x="95" y="20" font-family="sans-serif" font-size="12" fill="#94a3b8">Watches (8)</text>

    <rect x="205" y="0" width="125" height="30" rx="6" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <text x="218" y="20" font-family="sans-serif" font-size="12" fill="#94a3b8">Leather Goods (6)</text>

    <rect x="340" y="0" width="110" height="30" rx="6" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <text x="355" y="20" font-family="sans-serif" font-size="12" fill="#94a3b8">Accessories (4)</text>
  </g>

  <!-- Product Grid (3 Luxury Showcase Cards) -->

  <!-- Card 1: Chronos Noir 40mm Watch -->
  <g transform="translate(50, 365)">
    <rect x="0" y="0" width="345" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Image Box -->
    <rect x="15" y="15" width="315" height="190" rx="8" fill="#070a10" stroke="#182234" stroke-width="1" />
    
    <!-- Watch Illustration -->
    <!-- Watch Strap -->
    <rect x="157" y="30" width="30" height="160" rx="4" fill="#1a1c23" stroke="#2a2e3d" stroke-width="1" />
    <!-- Watch Case -->
    <circle cx="172" cy="110" r="50" fill="#0d1117" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="172" cy="110" r="44" fill="#080b0f" />
    <!-- Hour Markers -->
    <line x1="172" y1="72" x2="172" y2="78" stroke="#f59e0b" stroke-width="2" />
    <line x1="172" y1="142" x2="172" y2="148" stroke="#f59e0b" stroke-width="2" />
    <line x1="134" y1="110" x2="140" y2="110" stroke="#f59e0b" stroke-width="2" />
    <line x1="204" y1="110" x2="210" y2="110" stroke="#f59e0b" stroke-width="2" />
    <!-- Hands -->
    <line x1="172" y1="110" x2="172" y2="88" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="172" y1="110" x2="190" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="172" cy="110" r="3" fill="#f59e0b" />

    <!-- Badges -->
    <rect x="25" y="25" width="55" height="20" rx="4" fill="#0284c7" opacity="0.3" />
    <text x="32" y="39" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">FEATURED</text>

    <!-- Card Content -->
    <text x="20" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Chronos Noir 40mm Watch</text>
    <text x="20" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">Sapphire crystal glass · 5ATM water resistant</text>
    <text x="20" y="295" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$320.00</text>

    <rect x="235" y="272" width="95" height="34" rx="6" fill="#0284c7" />
    <text x="252" y="293" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Add to Bag</text>
  </g>

  <!-- Card 2: Cognac Leather Folio -->
  <g transform="translate(425, 365)">
    <rect x="0" y="0" width="345" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Image Box -->
    <rect x="15" y="15" width="315" height="190" rx="8" fill="#070a10" stroke="#182234" stroke-width="1" />
    
    <!-- Leather Folio Illustration -->
    <rect x="105" y="45" width="135" height="130" rx="10" fill="#78350f" stroke="#92400e" stroke-width="2" />
    <path d="M 105 75 L 240 75" stroke="#451a03" stroke-width="2" stroke-dasharray="4,4" />
    <rect x="160" y="65" width="25" height="20" rx="4" fill="#d97706" />
    <circle cx="172" cy="75" r="4" fill="#fef3c7" />

    <!-- Badges -->
    <rect x="25" y="25" width="65" height="20" rx="4" fill="#d97706" opacity="0.3" />
    <text x="32" y="39" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f59e0b">HANDCRAFTED</text>

    <!-- Card Content -->
    <text x="20" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Heritage Cognac Leather Folio</text>
    <text x="20" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">Full-grain calfskin · 14" laptop compartment</text>
    <text x="20" y="295" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$180.00</text>

    <rect x="235" y="272" width="95" height="34" rx="6" fill="#0284c7" />
    <text x="252" y="293" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Add to Bag</text>
  </g>

  <!-- Card 3: Obsidian Diver Limited -->
  <g transform="translate(800, 365)">
    <rect x="0" y="0" width="350" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Image Box -->
    <rect x="15" y="15" width="320" height="190" rx="8" fill="#070a10" stroke="#182234" stroke-width="1" />
    
    <!-- Watch Illustration (Steel Mesh) -->
    <rect x="160" y="30" width="30" height="160" rx="4" fill="#334155" stroke="#475569" stroke-width="1" />
    <circle cx="175" cy="110" r="52" fill="#0f172a" stroke="#06b6d4" stroke-width="3" />
    <circle cx="175" cy="110" r="44" fill="#020617" />
    <circle cx="175" cy="110" r="3" fill="#38bdf8" />
    <line x1="175" y1="110" x2="175" y2="84" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="175" y1="110" x2="200" y2="110" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Badges -->
    <rect x="25" y="25" width="75" height="20" rx="4" fill="#10b981" opacity="0.3" />
    <text x="32" y="39" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">LIMITED (20)</text>

    <!-- Card Content -->
    <text x="20" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Obsidian Automatic Diver</text>
    <text x="20" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">Ceramic rotating bezel · 48-hr power reserve</text>
    <text x="20" y="295" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">$450.00</text>

    <rect x="240" y="272" width="95" height="34" rx="6" fill="#0284c7" />
    <text x="257" y="293" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Add to Bag</text>
  </g>
</svg>
