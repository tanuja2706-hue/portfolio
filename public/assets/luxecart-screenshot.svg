<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="680" fill="#fcfbf9" />

  <!-- Top Navigation Bar -->
  <g id="navbar">
    <!-- LuxeCart Brand Logo -->
    <text x="40" y="44" font-family="'Times New Roman', Times, Georgia, serif" font-size="26" font-weight="700" letter-spacing="1.5" fill="#111827">LuxeCart</text>

    <!-- Navigation Links -->
    <g font-size="14" font-weight="500" fill="#4b5563">
      <text x="260" y="42">Home</text>
      <text x="330" y="42" font-weight="700" fill="#111827">Shop All</text>
      <!-- Active Underline -->
      <line x1="330" y1="49" x2="385" y2="49" stroke="#111827" stroke-width="2" />
      <text x="415" y="42">Women</text>
      <text x="495" y="42">Men</text>
      <text x="555" y="42">Accessories</text>
      <text x="665" y="42">Jewelry</text>
      <text x="745" y="42">Living</text>
    </g>

    <!-- Search Input Box -->
    <rect x="890" y="22" width="150" height="34" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1" />
    <circle cx="906" cy="39" r="5" stroke="#9ca3af" stroke-width="1.5" fill="none" />
    <line x1="910" y1="43" x2="915" y2="48" stroke="#9ca3af" stroke-width="1.5" />
    <text x="924" y="44" font-size="12" fill="#9ca3af">Search catalog</text>
    <rect x="1012" y="27" width="22" height="24" rx="4" fill="#e5e7eb" />
    <text x="1016" y="43" font-size="10" font-weight="600" fill="#6b7280">⌘K</text>

    <!-- Nav Icons: Box, Wishlist, Cart -->
    <!-- Box Icon -->
    <path d="M1065 30 L1075 25 L1085 30 L1075 35 Z M1065 32 L1065 44 L1075 49 L1075 36 Z M1085 32 L1085 44 L1075 49 L1075 36 Z" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Heart Icon with (2) badge -->
    <path d="M1115 32 C1112 28 1106 28 1103 33 C1100 28 1094 28 1091 33 C1087 40 1097 47 1103 52 C1109 47 1119 40 1115 32 Z" fill="none" stroke="#1f2937" stroke-width="1.5" />
    <circle cx="1116" cy="28" r="8" fill="#1f2937" />
    <text x="1113" y="32" font-size="10" font-weight="700" fill="#ffffff">2</text>

    <!-- Cart Bag Icon with (1) badge -->
    <rect x="1145" y="30" width="18" height="19" rx="3" fill="none" stroke="#1f2937" stroke-width="1.5" />
    <path d="M1150 30 V26 C1150 23.5 1152 22 1154 22 C1156 22 1158 23.5 1158 26 V30" fill="none" stroke="#1f2937" stroke-width="1.5" />
    <circle cx="1165" cy="28" r="8" fill="#1f2937" />
    <text x="1162" y="32" font-size="10" font-weight="700" fill="#ffffff">1</text>
  </g>

  <!-- Divider Line -->
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#f3f4f6" stroke-width="1" />

  <!-- Main Hero Section Content -->
  <g id="hero-content">
    
    <!-- Left Column: Editorial Copy & CTAs -->
    <g transform="translate(40, 150)">
      <!-- Atelier Tag -->
      <line x1="0" y1="0" x2="30" y2="0" stroke="#92400e" stroke-width="2" />
      <text x="40" y="4" font-size="12" font-weight="700" letter-spacing="2.5" fill="#92400e">AUTUMN / WINTER 2026 ATELIER</text>

      <!-- Headline -->
      <text x="0" y="75" font-family="'Times New Roman', Times, Georgia, serif" font-size="52" font-weight="500" fill="#111827" letter-spacing="-0.5">
        A study in quiet luxury, honest
      </text>
      <text x="0" y="135" font-family="'Times New Roman', Times, Georgia, serif" font-size="52" font-weight="500" fill="#111827" letter-spacing="-0.5">
        materiality &amp; sculpted drape.
      </text>

      <!-- Subtitle Description -->
      <text x="0" y="200" font-size="16" fill="#6b7280" line-height="1.6">
        Curated for discerning wardrobes without seasonal obsolescence.
      </text>
      <text x="0" y="228" font-size="16" fill="#6b7280" line-height="1.6">
        Experience 520gsm Mongolian cashmere, sandwashed Como silks,
      </text>
      <text x="0" y="256" font-size="16" fill="#6b7280" line-height="1.6">
        Okayama selvedge, and hand-carved Roman travertine.
      </text>

      <!-- CTA Buttons -->
      <!-- Shop Women Button -->
      <rect x="0" y="310" width="155" height="48" rx="8" fill="#18181b" />
      <text x="24" y="340" font-size="13" font-weight="700" letter-spacing="1" fill="#ffffff">SHOP WOMEN  →</text>

      <!-- Shop Men Button -->
      <rect x="175" y="310" width="135" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
      <text x="202" y="340" font-size="13" font-weight="700" letter-spacing="1" fill="#18181b">SHOP MEN</text>

      <!-- Atelier Story Link -->
      <circle cx="340" cy="334" r="7" stroke="#4b5563" stroke-width="1.5" fill="none" />
      <line x1="337" y1="334" x2="343" y2="334" stroke="#4b5563" stroke-width="1.5" />
      <line x1="340" y1="331" x2="340" y2="337" stroke="#4b5563" stroke-width="1.5" />
      <text x="355" y="339" font-size="13" font-weight="600" letter-spacing="1" fill="#4b5563">ATELIER STORY</text>
    </g>

    <!-- Right Column: Editorial Model Card Showcase -->
    <g transform="translate(730, 95)">
      <!-- Main Model Visual Container with rounded corners -->
      <clipPath id="modelClip">
        <rect x="0" y="0" width="440" height="555" rx="16" />
      </clipPath>

      <g clip-path="url(#modelClip)">
        <!-- Image Backdrop Gradient simulating concrete architectural texture -->
        <rect x="0" y="0" width="440" height="555" fill="#a8a29e" />
        <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#d6d3d1" />
          <stop offset="60%" stop-color="#a8a29e" />
          <stop offset="100%" stop-color="#57534e" />
        </linearGradient>
        <rect x="0" y="0" width="440" height="555" fill="url(#warmLight)" />

        <!-- Model Silhouette Elements: Jacket, Beanie, Hair -->
        <!-- Model Torso (Green Cashmere Trench Jacket) -->
        <path d="M80 555 L110 320 L150 260 L240 220 L300 240 L360 300 L410 555 Z" fill="#4a5340" />
        
        <!-- White Tee Collar -->
        <path d="M190 320 C220 340 260 340 280 320 L270 420 L200 420 Z" fill="#f4f4f5" />
        <text x="210" y="370" font-size="18" font-weight="900" fill="#27272a" letter-spacing="1">BLA...</text>

        <!-- Trench Collar & Lapels -->
        <path d="M150 260 L205 340 L170 470 L110 400 Z" fill="#3f4736" stroke="#2e3527" stroke-width="1.5" />
        <path d="M300 240 L265 340 L310 470 L370 400 Z" fill="#3f4736" stroke="#2e3527" stroke-width="1.5" />
        
        <!-- Model Neck & Face Profile -->
        <path d="M205 280 C210 240 215 200 225 180 C240 180 270 190 280 220 C280 250 265 290 260 310 Z" fill="#fecaca" />
        <path d="M225 180 C235 170 255 165 265 175 C275 190 270 215 265 225 Z" fill="#fed7aa" />

        <!-- Short Blonde Hair -->
        <path d="M195 190 C185 220 180 260 210 270 C225 270 225 240 215 220 Z" fill="#fef08a" />
        <path d="M265 190 C285 220 290 260 270 270 C255 270 255 240 265 220 Z" fill="#fef08a" />

        <!-- Black Beanie with red emblem -->
        <path d="M210 185 C215 130 245 110 285 130 C300 150 305 180 300 200 C275 190 235 185 210 185 Z" fill="#1c1917" />
        <rect x="250" y="145" width="12" height="6" rx="1" fill="#dc2626" />

        <!-- Trench Details: Genuine Horn Buttons & Flap -->
        <circle cx="195" cy="460" r="6" fill="#1c1917" stroke="#78716c" stroke-width="1" />
        <circle cx="195" cy="520" r="6" fill="#1c1917" stroke="#78716c" stroke-width="1" />
        
        <!-- Dark Overlay Gradient at Bottom for text readability -->
        <linearGradient id="overlayFade" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0" />
          <stop offset="40%" stop-color="#000000" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0.92" />
        </linearGradient>
        <rect x="0" y="240" width="440" height="315" fill="url(#overlayFade)" />

        <!-- Floating Product Info Card at Bottom of Image -->
        <g transform="translate(25, 395)">
          <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="1.5" fill="#d1d5db">ATELIER SIGNATURE · 520GSM CASHMERE</text>
          
          <text x="0" y="32" font-family="'Times New Roman', Times, Georgia, serif" font-size="28" font-weight="600" fill="#ffffff">
            The Double-Breasted Trench
          </text>
          
          <text x="0" y="60" font-size="12" fill="#d1d5db">
            Tailored with genuine horn button closures, storm flap detailing, and
          </text>
          <text x="0" y="78" font-size="12" fill="#d1d5db">
            hand-finished pick-stitched lapels.
          </text>

          <text x="0" y="122" font-size="20" font-weight="700" fill="#ffffff">₹24,999</text>
          
          <text x="270" y="122" font-size="13" font-weight="600" fill="#ffffff">View Piece →</text>
        </g>
      </g>
    </g>

  </g>
</svg>
