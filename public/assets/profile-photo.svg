<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Soft warm indoor studio lighting with bokeh -->
    <radialGradient id="studioBg" cx="35%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#e8dfd5" />
      <stop offset="35%" stop-color="#cfc4b6" />
      <stop offset="70%" stop-color="#9d9183" />
      <stop offset="100%" stop-color="#5c5349" />
    </radialGradient>

    <!-- Warm Lamp Ambient Bokeh on left -->
    <radialGradient id="lampGlow" cx="20%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0" />
    </radialGradient>

    <!-- Skin Foundation Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d6c6" />
      <stop offset="45%" stop-color="#ebc2af" />
      <stop offset="85%" stop-color="#dca994" />
      <stop offset="100%" stop-color="#cb9681" />
    </linearGradient>

    <!-- Subtle Cheek Blush Gradient -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Lip Tone Gradient -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd6b68" />
      <stop offset="50%" stop-color="#a45353" />
      <stop offset="100%" stop-color="#883b3b" />
    </linearGradient>

    <!-- Rich Black Hair Gradient with glossy sheen -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2428" />
      <stop offset="30%" stop-color="#181418" />
      <stop offset="70%" stop-color="#0d0b0d" />
      <stop offset="100%" stop-color="#050405" />
    </linearGradient>

    <!-- Hair Sheen Highlight -->
    <linearGradient id="hairSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3e47" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#181418" stop-opacity="0" />
    </linearGradient>

    <!-- Black Tailored Blazer Gradient -->
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0f0e0d" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- White Inner Ribbed Top -->
    <linearGradient id="whiteTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>

  <!-- 1. Background -->
  <rect width="600" height="600" fill="url(#studioBg)" />
  <circle cx="100" cy="240" r="140" fill="url(#lampGlow)" />

  <!-- Soft Indoor Green Foliage Silhouette in background left -->
  <g opacity="0.35" fill="#4d5f47">
    <path d="M40 380 C30 330 50 280 70 230 C80 280 85 330 80 380 Z" />
    <path d="M70 340 C90 290 120 250 140 210 C130 260 115 310 95 350 Z" />
    <path d="M15 310 C-10 270 5 220 25 180 C35 225 30 270 25 310 Z" />
  </g>

  <!-- Chair Backrest Silhouette behind shoulders -->
  <rect x="170" y="320" width="260" height="280" rx="30" fill="#18181b" opacity="0.85" />

  <!-- 2. Body: Black Blazer & White Inner Top -->
  <!-- Shoulders & Torso -->
  <path d="M110 600 L140 430 L200 370 L400 370 L460 430 L490 600 Z" fill="url(#blazerGrad)" />

  <!-- White Crew Neck Inner Top -->
  <path d="M255 400 C270 415 330 415 345 400 L355 600 L245 600 Z" fill="url(#whiteTop)" />

  <!-- Blazer Lapels & Structure -->
  <!-- Left Lapel -->
  <path d="M200 370 L260 490 L240 600 L130 600 L140 430 Z" fill="#141214" stroke="#292524" stroke-width="1.5" />
  <!-- Right Lapel -->
  <path d="M400 370 L340 490 L360 600 L470 600 L460 430 Z" fill="#141214" stroke="#292524" stroke-width="1.5" />

  <!-- 3. Neck & Collarbone -->
  <path d="M260 310 C260 360 275 410 300 410 C325 410 340 360 340 310 Z" fill="#e0b29d" />
  <!-- Neck shadow under chin -->
  <path d="M265 315 C285 338 315 338 335 315 C320 330 280 330 265 315 Z" fill="#b9826f" opacity="0.6" />

  <!-- 4. Back Hair Cascade (falling behind shoulders) -->
  <path d="M190 200 C150 250 140 380 150 560 C180 570 210 560 210 480 C190 380 200 260 220 210 Z" fill="url(#hairGrad)" />
  <path d="M410 200 C450 250 460 380 450 560 C420 570 390 560 390 480 C410 380 400 260 380 210 Z" fill="url(#hairGrad)" />

  <!-- 5. Face Contour (Gentle Oval Jawline) -->
  <path d="M225 210 C225 150 375 150 375 210 C375 280 350 330 300 330 C250 330 225 280 225 210 Z" fill="url(#faceGrad)" />

  <!-- Subtle Cheeks Blush -->
  <circle cx="258" cy="245" r="28" fill="url(#blush)" />
  <circle cx="342" cy="245" r="28" fill="url(#blush)" />

  <!-- 6. Facial Features -->
  <!-- Eyebrows (Soft arched, natural black) -->
  <path d="M246 198 Q265 190 282 198" fill="none" stroke="#231a20" stroke-width="3" stroke-linecap="round" />
  <path d="M318 198 Q335 190 354 198" fill="none" stroke="#231a20" stroke-width="3" stroke-linecap="round" />

  <!-- Eyes (Warm dark brown / black with realistic highlights) -->
  <!-- Left Eye -->
  <ellipse cx="266" cy="214" rx="14" ry="9" fill="#ffffff" />
  <circle cx="266" cy="214" r="8" fill="#1c1318" />
  <circle cx="266" cy="214" r="5" fill="#0a0608" />
  <circle cx="268" cy="212" r="2.5" fill="#ffffff" />
  <!-- Upper lash line -->
  <path d="M250 215 Q266 205 282 215" fill="none" stroke="#1c1318" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Eye -->
  <ellipse cx="334" cy="214" rx="14" ry="9" fill="#ffffff" />
  <circle cx="334" cy="214" r="8" fill="#1c1318" />
  <circle cx="334" cy="214" r="5" fill="#0a0608" />
  <circle cx="336" cy="212" r="2.5" fill="#ffffff" />
  <!-- Upper lash line -->
  <path d="M318 215 Q334 205 350 215" fill="none" stroke="#1c1318" stroke-width="2.5" stroke-linecap="round" />

  <!-- Delicate Nose -->
  <path d="M298 215 L297 248 C294 252 306 252 303 248" fill="none" stroke="#c08c78" stroke-width="1.8" stroke-linecap="round" />
  <!-- Nostril curves -->
  <path d="M291 248 Q296 250 300 248" fill="none" stroke="#b9826f" stroke-width="1.5" />
  <path d="M309 248 Q304 250 300 248" fill="none" stroke="#b9826f" stroke-width="1.5" />

  <!-- Lips (Full, soft mauve-rose tint) -->
  <path d="M280 274 Q300 268 320 274 Q300 280 280 274 Z" fill="url(#lipGrad)" />
  <path d="M282 274 Q300 288 318 274 Q300 280 282 274 Z" fill="#9c4d4d" />
  <line x1="281" y1="274" x2="319" y2="274" stroke="#6b2b2b" stroke-width="1" />

  <!-- 7. Foreground Hair Styling (Flowing over shoulders) -->
  <!-- Top Volume & Center-Left Parting -->
  <path d="M300 130 C220 130 180 180 175 270 C170 350 190 470 215 560 C235 560 245 490 235 410 C225 330 220 230 250 175 C270 145 295 140 300 140 C305 140 330 145 350 175 C380 230 375 330 365 410 C355 490 365 560 385 560 C410 470 430 350 425 270 C420 180 380 130 300 130 Z" fill="url(#hairGrad)" />

  <!-- Soft waves framing the face -->
  <path d="M225 170 C210 220 215 280 235 340 C242 320 240 280 235 240 C230 200 235 180 245 170 Z" fill="#181418" />
  <path d="M375 170 C390 220 385 280 365 340 C358 320 360 280 365 240 C370 200 365 180 355 170 Z" fill="#181418" />

  <!-- Glossy Sheen Highlights on Hair Crowns -->
  <path d="M240 160 C260 145 280 140 295 140 C270 145 250 160 240 180 Z" fill="url(#hairSheen)" />
  <path d="M360 160 C340 145 320 140 305 140 C330 145 350 160 360 180 Z" fill="url(#hairSheen)" />
</svg>
