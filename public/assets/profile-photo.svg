<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f2b38" />
      <stop offset="60%" stop-color="#09141f" />
      <stop offset="100%" stop-color="#050a10" />
    </radialGradient>

    <!-- Subtle Cyan Ambient Glow -->
    <radialGradient id="cyanAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d69b76" />
      <stop offset="50%" stop-color="#c98a63" />
      <stop offset="100%" stop-color="#b67752" />
    </linearGradient>

    <!-- Shadow Skin Gradient -->
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8744f" />
      <stop offset="100%" stop-color="#9d5b38" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241b21" />
      <stop offset="50%" stop-color="#181216" />
      <stop offset="100%" stop-color="#0c0a0c" />
    </linearGradient>

    <!-- Blazer Gradient -->
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Inner Shirt / Top -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Vignette / Border Glow -->
    <linearGradient id="borderRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Head -->
  <circle cx="250" cy="230" r="180" fill="url(#cyanAura)" />

  <!-- Ambient Tech Grid Overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="150" x2="450" y2="150" />
    <line x1="50" y1="250" x2="450" y2="250" />
    <line x1="50" y1="350" x2="450" y2="350" />
    <line x1="150" y1="50" x2="150" y2="450" />
    <line x1="250" y1="50" x2="250" y2="450" />
    <line x1="350" y1="50" x2="350" y2="450" />
  </g>

  <!-- Back Hair Waves -->
  <path d="M 160 170 C 130 220 120 310 140 380 C 160 430 200 450 200 450 L 300 450 C 300 450 340 430 360 380 C 380 310 370 220 340 170 Z" fill="url(#hairGrad)" />

  <!-- Shoulders & Blazer -->
  <g>
    <!-- Base Body Silhouette -->
    <path d="M 120 500 C 120 420 150 370 200 350 L 250 380 L 300 350 C 350 370 380 420 380 500 Z" fill="url(#blazerGrad)" />

    <!-- Inner Top / Blouse (Cyan Accent) -->
    <path d="M 215 355 L 250 430 L 285 355 C 285 355 265 375 250 375 C 235 375 215 355 215 355 Z" fill="url(#topGrad)" />

    <!-- Blazer Lapels -->
    <!-- Left Lapel -->
    <path d="M 185 355 L 235 460 L 210 500 L 140 500 C 130 460 150 400 185 355 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Right Lapel -->
    <path d="M 315 355 L 265 460 L 290 500 L 360 500 C 370 460 350 400 315 355 Z" fill="#1a2436" stroke="#334155" stroke-width="1.5" />

    <!-- Lapel Accent Stitching Line -->
    <path d="M 195 365 L 240 465" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <path d="M 305 365 L 260 465" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- Neck & Collarbone -->
  <g>
    <path d="M 220 270 L 220 360 C 235 370 265 370 280 360 L 280 270 Z" fill="url(#skinShadow)" />
    <path d="M 225 270 L 225 350 C 238 358 262 358 275 350 L 275 270 Z" fill="url(#skinGrad)" />
    <!-- Collar shadow -->
    <path d="M 220 330 C 240 345 260 345 280 330 C 270 350 230 350 220 330 Z" fill="#9d5b38" opacity="0.3" />
  </g>

  <!-- Head & Face Structure -->
  <g>
    <!-- Jaw & Face Base -->
    <path d="M 175 180 C 175 270 195 320 250 320 C 305 320 325 270 325 180 C 325 120 300 95 250 95 C 200 95 175 120 175 180 Z" fill="url(#skinGrad)" />

    <!-- Ears -->
    <!-- Left Ear -->
    <ellipse cx="174" cy="205" rx="10" ry="18" fill="url(#skinGrad)" />
    <ellipse cx="174" cy="205" rx="5" ry="10" fill="url(#skinShadow)" />
    <circle cx="174" cy="218" r="2.5" fill="#38bdf8" />
    <!-- Right Ear -->
    <ellipse cx="326" cy="205" rx="10" ry="18" fill="url(#skinGrad)" />
    <ellipse cx="326" cy="205" rx="5" ry="10" fill="url(#skinShadow)" />
    <circle cx="326" cy="218" r="2.5" fill="#38bdf8" />

    <!-- Cheeks & Soft Blush -->
    <ellipse cx="205" cy="225" rx="18" ry="10" fill="#e07a65" opacity="0.2" />
    <ellipse cx="295" cy="225" rx="18" ry="10" fill="#e07a65" opacity="0.2" />

    <!-- Eyes Group -->
    <g>
      <!-- Eyebrows -->
      <path d="M 195 175 C 208 168 224 168 232 173" stroke="#1c1417" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 305 175 C 292 168 276 168 268 173" stroke="#1c1417" stroke-width="4.5" stroke-linecap="round" fill="none" />

      <!-- Left Eye -->
      <ellipse cx="214" cy="192" rx="13" ry="8" fill="#f8fafc" />
      <circle cx="215" cy="192" r="6" fill="#2d1b18" />
      <circle cx="216" cy="192" r="3" fill="#090606" />
      <circle cx="213" cy="189" r="2" fill="#ffffff" />
      <path d="M 200 192 C 207 184 222 184 229 192" stroke="#1c1417" stroke-width="3" stroke-linecap="round" fill="none" />

      <!-- Right Eye -->
      <ellipse cx="286" cy="192" rx="13" ry="8" fill="#f8fafc" />
      <circle cx="285" cy="192" r="6" fill="#2d1b18" />
      <circle cx="284" cy="192" r="3" fill="#090606" />
      <circle cx="283" cy="189" r="2" fill="#ffffff" />
      <path d="M 271 192 C 278 184 293 184 300 192" stroke="#1c1417" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- Nose -->
    <path d="M 249 190 L 246 226 C 246 230 254 230 254 226 Z" fill="none" stroke="url(#skinShadow)" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="250" cy="228" rx="7" ry="3.5" fill="#a4623e" opacity="0.4" />

    <!-- Confident Warm Smile -->
    <g>
      <!-- Lips base -->
      <path d="M 226 256 C 238 250 262 250 274 256 C 265 274 235 274 226 256 Z" fill="#b94a48" />
      <!-- Teeth -->
      <path d="M 232 256 C 242 258 258 258 268 256 C 264 262 236 262 232 256 Z" fill="#ffffff" />
      <!-- Upper Lip Line -->
      <path d="M 224 255 C 236 250 247 254 250 253 C 253 254 264 250 276 255" stroke="#872929" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Front Hair Styling (Modern Side-Parted Waves) -->
  <g>
    <!-- Top Volume -->
    <path d="M 168 165 C 160 110 200 65 250 65 C 310 65 340 110 332 165 C 320 120 280 90 245 92 C 195 95 175 130 168 165 Z" fill="url(#hairGrad)" />
    <!-- Left Hair Strand Framing Face -->
    <path d="M 172 155 C 165 210 160 270 178 330 C 185 310 188 240 182 180 Z" fill="url(#hairGrad)" />
    <!-- Right Hair Strand Sweeping Shoulder -->
    <path d="M 328 155 C 338 210 345 280 325 350 C 318 300 315 230 318 175 Z" fill="url(#hairGrad)" />
    <!-- Hair Highlight Shimmer -->
    <path d="M 215 85 C 245 78 280 82 295 95" stroke="#4a3b45" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Modern Subtle Glasses (Optional High-Tech Touch) -->
  <g opacity="0.9">
    <!-- Left Rim -->
    <rect x="195" y="180" width="38" height="26" rx="6" fill="none" stroke="#22d3ee" stroke-width="2.2" opacity="0.85" />
    <!-- Right Rim -->
    <rect x="267" y="180" width="38" height="26" rx="6" fill="none" stroke="#22d3ee" stroke-width="2.2" opacity="0.85" />
    <!-- Bridge -->
    <path d="M 233 189 C 244 186 256 186 267 189" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" />
    <!-- Left Arm -->
    <path d="M 195 188 L 175 185" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M 305 188 L 325 185" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" />
    <!-- Glass Lens Reflections -->
    <path d="M 200 185 L 210 185" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 272 185 L 282 185" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Circular Outer Tech Ring -->
  <circle cx="250" cy="250" r="246" fill="none" stroke="url(#borderRing)" stroke-width="4" />
</svg>
